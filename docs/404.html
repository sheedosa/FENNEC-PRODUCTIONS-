    <script>
      localStorage.setItem('i18nextLng', 'en');

      // Live favicon swap when OS theme changes (no refresh needed)
      (function () {
        if (!window.matchMedia) return;
        var mql = window.matchMedia('(prefers-color-scheme: dark)');
        function setFavicon(isDark) {
          var theme = isDark ? 'dark' : 'light';
          var sizes = [
            { size: '16x16',  attr: '16'  },
            { size: '32x32',  attr: '32'  },
            { size: '48x48',  attr: '48'  }
          ];
          // Remove any existing png icons
          document.querySelectorAll('link[rel="icon"][type="image/png"]').forEach(function (el) { el.remove(); });
          sizes.forEach(function (s) {
            var link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/png';
            link.sizes = s.size;
            link.href = './images/favicon-' + theme + '-' + s.attr + '.png?v=' + Date.now();
            document.head.appendChild(link);
          });
        }
        setFavicon(mql.matches);
        mql.addEventListener
          ? mql.addEventListener('change', function (e) { setFavicon(e.matches); })
          : mql.addListener(function (e) { setFavicon(e.matches); });
      })();
    </script>
